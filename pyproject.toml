[project]
name = "fraudguard"
version = "0.1.0"
description = "Real-Time Fraud Detection Engine with Django, Celery, and Channels"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "djangorestframework>=3.14.0",
    "djangorestframework-simplejwt>=5.3.0",
    "python-dotenv>=1.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "channels>=4.0.0",
    "daphne>=4.0.0",
    "channels-redis>=4.0.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.0",
    "factory-boy>=3.3.0",
    "fakeredis>=2.20.0",
    "locust>=2.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fraudguard*", "accounts*", "transactions*", "risk*", "alerts*", "audit*"]
